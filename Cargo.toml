[workspace]
members = ["crates/server", "crates/sftp", "crates/shared", "crates/web"]
default-members = ["crates/server", "crates/sftp", "crates/shared"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
glassftp-shared = { path = "crates/shared" }
glassftp-sftp = { path = "crates/sftp" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.release.package.glassftp-web]
strip = "debuginfo"

