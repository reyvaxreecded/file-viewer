[package]
name = "glassftp-web"
version.workspace = true
edition.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
glassftp-shared.workspace = true
leptos = { version = "0.8.23", features = ["csr"] }
serde.workspace = true
serde_json.workspace = true
gloo-net = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Window", "Document", "Storage", "KeyboardEvent", "MouseEvent", "HtmlInputElement", "HtmlTextAreaElement", "EventSource", "MessageEvent", "CustomEvent", "CustomEventInit", "Location", "History", "Navigator", "Clipboard", "DragEvent", "DataTransfer"] }

