# Install under /etc/nginx/conf.d/, in the http context.
# Adapt server_name, LAN range and certificate paths before enabling.
limit_req_zone $binary_remote_addr zone=glassftp_requests:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=glassftp_connections:10m;

server {
    listen 443 ssl;
    server_name glassftp.lan;
    ssl_certificate /etc/glassftp/tls/fullchain.pem;
    ssl_certificate_key /etc/glassftp/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow 192.168.10.0/24; # REPLACE with the team's actual subnet.
    allow 127.0.0.1;
    deny all;

    # 8 MiB is the protocol's maximum CHUNK, not the whole file limit.
    client_max_body_size 8m;
    client_body_timeout 60s;
    send_timeout 60s;
    limit_req zone=glassftp_requests burst=60 nodelay;
    limit_req_status 429;
    limit_conn glassftp_connections 24;
    limit_conn_status 429;
    # Avoid recording confidential filenames in query strings.
    access_log off;
    error_log /var/log/nginx/glassftp-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Never retry a mutation against another upstream.
        proxy_next_upstream off;
    }
}

# Reject arbitrary hostnames and direct-IP requests. Merge with existing
# default servers rather than installing conflicting default_server blocks.
