# /etc/ssh/sshd_config.d/70-glassftp.conf
# Validate with sshd -t. Preserve existing admin SSH rules.
Match User glassftp-sftp
    ChrootDirectory /srv/glassftp
    ForceCommand internal-sftp -d /shared -u 0027
    PasswordAuthentication yes
    AuthenticationMethods password
    PubkeyAuthentication no
    KbdInteractiveAuthentication no
    DisableForwarding yes
    PermitTTY no
    PermitTunnel no
    X11Forwarding no
Match all

# Reject use of this shared service account from the network.
# The application connects to 127.0.0.1 only.
Match User glassftp-sftp Address *,!127.0.0.1,!::1
    DenyUsers glassftp-sftp
Match all
